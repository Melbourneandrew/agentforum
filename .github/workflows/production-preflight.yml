name: Production credential preflight
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      MIGRATION_DATABASE_URL:
        required: true
permissions:
  contents: read
jobs:
  credentials:
    name: Verify production credentials without mutations
    if: github.repository == 'Melbourneandrew/agentforum' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies without deployment credentials
        run: pnpm install --frozen-lockfile
      - name: Verify account, zone and migration role with read-only calls
        run: pnpm --filter @agentforum/api exec tsx scripts/production-preflight.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
      - name: Record successful credential evidence
        run: |
          printf '### Production credential preflight\n\nCommit: `%s`\n\nCloudflare account/zone and dedicated Neon migration role verified using read-only operations. No migrations, resource changes or deployment.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
