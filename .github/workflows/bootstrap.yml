name: Bootstrap
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    name: Bootstrap tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install checksum-pinned compatibility tool
        run: pnpm ci:setup
      - name: Check dependency resolution
        run: pnpm dependency:check
      - name: Check formatting, typed lint, strict types, Effect diagnostics and tooling tests
        run: pnpm check
      - name: Verify generated database migration artifacts
        run: pnpm --filter @agentforum/api db:generate
      - name: Validate generated API contract
        run: pnpm --filter @agentforum/api contract:check && pnpm --filter @agentforum/api contract:generate
      - name: Reject incompatible contract changes
        run: pnpm contract:compat "$CONTRACT_BASE"
      - name: Build production applications
        run: pnpm build
      - name: Verify production API bundle in local workerd
        run: pnpm --filter @agentforum/api bundle:smoke
      - name: Install browser runtime for observation verification
        run: pnpm --filter @agentforum/web exec playwright install --with-deps chromium
      - name: Verify production observation bundle, routing and CSP in Chromium
        run: pnpm --filter @agentforum/web bundle:smoke
      - name: Verify static documentation crawl, Markdown and non-JavaScript navigation
        run: pnpm --filter @agentforum/docs bundle:smoke
      - name: Verify all six shared discovery routes in production workerd bundles
        run: pnpm discovery:smoke
      - name: Audit dependencies
        run: pnpm security:check
      - name: Record the current task graph
        run: pnpm turbo run build lint typecheck test --dry=json > "$RUNNER_TEMP/task-graph.json"
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Record evidence identity
        if: always()
        run: |
          printf '### Required verification evidence\n\nCommit: `%s`\n\nIncludes API workerd tests, generated-contract validation and production-bundle smoke. Includes basic read-only observation API/PostgreSQL integration, pending-API loading, bounded keyset Previous, concurrent publication, malicious-content containment and production workerd/JavaScript-disabled Chromium checks. Includes static Fumadocs production crawl and non-JavaScript browser navigation. Includes public versioned OpenAPI/Post Schema source/model checks, generated basic operation docs, six-route shared operating-guide byte/media/method parity and a real discovery-recipe-driven GET/POST register/publish/retrieve/reply/resume journey against PostgreSQL/workerd. Includes mandatory owned PostgreSQL/workerd adapter and transaction tests, Node tooling lifecycle guards, actual drizzle-kit generate/apply/reset proof, and private smoke logic against a real local Worker. Full discovery corpus, advanced search and remote deployments remain unimplemented; local database evidence is not Hyperdrive or deployed evidence.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf '\nEvent: `%s`\nHead: `%s`\nContract baseline: `%s`\nJob status: `%s`\n\nThis summary identifies the run; individual step conclusions determine success. Required status: **Bootstrap tooling**. Branch-protection enforcement is verified separately, not asserted by this workflow.\n' "$EVENT_NAME" "$HEAD_SHA" "$CONTRACT_BASE" "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
