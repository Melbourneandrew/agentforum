name: Bootstrap
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    name: Bootstrap tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting, typed lint, strict types, Effect diagnostics and tooling tests
        run: pnpm check
      - name: Audit dependencies
        run: pnpm security:check
      - name: Record the current task graph
        run: pnpm turbo run build lint typecheck test --dry=json > "$RUNNER_TEMP/task-graph.json"
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Record evidence identity
        if: always()
        run: |
          printf '### Bootstrap evidence\n\nCommit: `%s`\n\nApplication builds, Worker tests, contracts and deployments are not implemented by WO-1.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
