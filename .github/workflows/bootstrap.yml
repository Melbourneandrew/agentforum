name: Bootstrap
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    name: Bootstrap tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: "false"
      CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: "false"
      CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install checksum-pinned compatibility tool
        run: pnpm ci:setup
      - name: Check dependency resolution
        run: pnpm dependency:check
      - name: Check formatting, typed lint, strict types, Effect diagnostics and tooling tests
        run: pnpm check
      - name: Validate generated API contract
        run: pnpm contract:check && pnpm contract:generate
      - name: Reject incompatible contract changes
        run: pnpm contract:compat "$CONTRACT_BASE"
      - name: Verify generated SQLite schema matches committed migrations
        run: |
          pnpm --filter @agentforum/forum db:generate
          git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Reject unsafe SQLite migrations and rewritten history
        run: pnpm db:safety "$CONTRACT_BASE"
      - name: Apply versioned local D1 migrations and verify repeatability
        run: pnpm db:migrate:local && pnpm db:migrate:local
      - name: Build production application
        run: pnpm build
      - name: Install browser runtime
        run: pnpm --filter @agentforum/forum exec playwright install --with-deps chromium
      - name: Verify production SSR, static assets, D1 and API boundaries in workerd and Chromium
        run: pnpm bundle:smoke
      - name: Qualify root local data-preserving release lifecycle
        run: pnpm exec tsx scripts/delivery/release-local.ts --qualify-local
      - name: Verify interrupted smoke cleanup
        run: pnpm --filter @agentforum/forum interruption:smoke
      - name: Verify source secrets cannot enter build artifacts
        run: pnpm --filter @agentforum/forum source-secrets:check
      - name: Audit dependencies
        run: pnpm security:check
      - name: Record the current task graph
        run: pnpm turbo run build lint typecheck test --dry=json > "$RUNNER_TEMP/task-graph.json"
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code && test -z "$(git ls-files --others --exclude-standard)"
      - name: Record evidence identity
        if: always()
        run: |
          printf '### Required verification evidence\n\nCommit: `%s`\n\nSingle Worker with genuine workerd/local D1 tests, strict types and all-zero Effect diagnostics, native D1 atomic identity/publication, immutable ordered tags, FTS5, fixed-window admission, lossless integer and SQLite migration/history gates, safe methods, origin/cache boundaries, generated foundation contract, versioned local migrations, production SSR/static/API and no-JavaScript browser checks. Domain operations explicitly return 501 until their owning work orders land. This is not complete-app, provider installation or public-readiness evidence.\n\nEvent: `%s`\nHead: `%s`\nContract baseline: `%s`\nJob status: `%s`\n' "$GITHUB_SHA" "$EVENT_NAME" "$HEAD_SHA" "$CONTRACT_BASE" "$JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          JOB_STATUS: ${{ job.status }}
